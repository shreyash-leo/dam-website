  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #F5F0EA;
    }

    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(250, 246, 240, 0.86);
      backdrop-filter: blur(18px);
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2rem;
      z-index: 1100;
      border-bottom: 1px solid rgba(75, 60, 45, 0.12);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.02);
    }

    .logo {
      font-family: 'Space Grotesk', monospace;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: #2C2418;
      text-transform: uppercase;
      background: rgba(80, 65, 50, 0.06);
      padding: 6px 14px;
      border-radius: 36px;
      backdrop-filter: blur(2px);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .logo:hover {
      background: rgba(80, 65, 50, 0.12);
      transform: scale(0.98);
    }

    .logo a {
      text-decoration: none;
      color: #2C2418;
    }

    .center-model-selector {
      position: fixed;
      top: 85px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1100;
      background: rgba(250, 246, 240, 0.92);
      backdrop-filter: blur(20px);
      border-radius: 56px;
      padding: 6px 12px;
      display: flex;
      gap: 8px;
      border: 1px solid rgba(60, 45, 30, 0.2);
      box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.1);
    }

    .model-chip {
      background: transparent;
      border: none;
      padding: 8px 22px;
      border-radius: 40px;
      font-size: 0.85rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      color: #4A3B2C;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
    }

    .model-chip.active {
      background: #2C2418;
      color: #FEF7F0;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .model-chip:hover:not(.active) {
      background: rgba(44, 36, 24, 0.08);
    }

    .nav-btn {
      background: rgba(44, 36, 24, 0.05);
      border: 1px solid rgba(44, 36, 24, 0.2);
      color: #2C2418;
      padding: 8px 20px;
      border-radius: 32px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: 'Inter', sans-serif;
    }

    .nav-btn:hover {
      background: rgba(44, 36, 24, 0.1);
      border-color: rgba(44, 36, 24, 0.4);
      transform: translateY(-1px);
    }

    /* ENHANCED INFO PANEL: Wider + Fully glass aesthetic with deep transparency */
    #infoPanel {
      position: absolute;
      right: 28px;
      top: 100px;
      width: 480px;           /* dramatically wider */
      max-width: 90vw;        /* responsive on smaller screens */
      background: rgba(245, 240, 234, 0.78);  /* more transparent background */
      backdrop-filter: blur(28px);
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 245, 0.4);
      overflow: hidden;
      z-index: 100;
      box-shadow: 0 20px 38px -12px rgba(0, 0, 0, 0.18);
      transition: all 0.2s ease;
    }

    .panel-header {
      padding: 20px 28px 12px;
      border-bottom: 1px solid rgba(80, 65, 50, 0.15);
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(250, 245, 238, 0.5);
    }

    .panel-header .icon-badge {
      width: 36px;
      height: 36px;
      background: rgba(70, 55, 40, 0.2);
      border-radius: 24px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      backdrop-filter: blur(4px);
    }

    .panel-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #5C4A34;
    }

    .panel-content {
      padding: 24px 28px 32px;
      max-height: calc(100vh - 180px);
      overflow-y: auto;
      color: #2C2418;
      scrollbar-width: thin;
    }

    /* Enhanced scrollbar to blend with transparency */
    .panel-content::-webkit-scrollbar {
      width: 5px;
    }
    .panel-content::-webkit-scrollbar-track {
      background: rgba(80, 65, 50, 0.12);
      border-radius: 10px;
    }
    .panel-content::-webkit-scrollbar-thumb {
      background: rgba(80, 65, 50, 0.5);
      border-radius: 10px;
    }

    #infoContent {
      font-size: 0.95rem;
      line-height: 1.6;
      font-weight: 450;
    }

    #infoContent h3 {
      font-size: 1.45rem;
      font-weight: 650;
      margin: 0 0 12px 0;
      color: #1F1A10;
      font-family: 'Space Grotesk', monospace;
      letter-spacing: -0.3px;
    }

    #infoContent b {
      font-weight: 650;
      color: #8B5E3C;
    }

    #infoContent ul {
      margin: 14px 0;
      padding-left: 22px;
    }

    #infoContent li {
      margin: 6px 0;
    }

    .tooltip-modern {
      position: absolute;
      background: rgba(30, 25, 20, 0.88);
      backdrop-filter: blur(16px);
      color: #FCF3E8;
      padding: 8px 20px;
      border-radius: 48px;
      font-size: 0.8rem;
      font-weight: 500;
      display: none;
      pointer-events: none;
      z-index: 1200;
      font-family: 'Inter', monospace;
      border: 1px solid rgba(255, 235, 200, 0.3);
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      letter-spacing: 0.3px;
    }

    .loading-indicator {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: #1F1A12;
      color: #FCF7F0;
      padding: 10px 28px;
      border-radius: 60px;
      font-size: 0.8rem;
      font-weight: 500;
      z-index: 1200;
      backdrop-filter: blur(12px);
      background: rgba(30, 25, 20, 0.92);
      border: 1px solid rgba(255, 240, 210, 0.25);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s ease;
      white-space: nowrap;
      font-family: monospace;
    }
    .loading-indicator.active {
      opacity: 1;
    }

    .controls-note {
      position: fixed;
      bottom: 18px;
      left: 20px;
      font-size: 0.7rem;
      color: rgba(60, 45, 30, 0.65);
      background: rgba(250, 246, 240, 0.65);
      backdrop-filter: blur(6px);
      padding: 5px 14px;
      border-radius: 28px;
      pointer-events: none;
      font-family: monospace;
      z-index: 100;
      font-weight: 500;
    }

    @media (max-width: 800px) {
      #infoPanel { width: 420px; right: 16px; top: 95px; }
      .center-model-selector { top: 75px; padding: 4px 10px; gap: 4px; }
      .model-chip { padding: 5px 14px; font-size: 0.7rem; }
      .panel-content { padding: 18px 22px 26px; }
    }
    @media (max-width: 600px) {
      #infoPanel { width: calc(100% - 32px); right: 16px; left: 16px; top: 100px; max-width: none; }
      .center-model-selector { width: 90%; justify-content: center; }
      .model-chip { padding: 6px 12px; }
      .logo { font-size: 0.75rem; padding: 4px 10px; }
    }
  </style>
</head>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "https://unpkg.com/three@0.158.0/examples/jsm/loaders/GLTFLoader.js";
    import { OrbitControls } from "https://unpkg.com/three@0.158.0/examples/jsm/controls/OrbitControls.js";

    const modelConfigs = {
      "models/dam.glb": {
        name: "Concrete Gravity Dam",
        partMap: {
          "BuildingMesh-00155001_65": "reservoir","BuildingMesh-00141001_60": "terrain","BuildingMesh-00142001_61": "terrain","BuildingMesh-00129001_58": "terrain",
          "BuildingMesh-00110001_52": "terrain","BuildingMesh-00171001_76": "terrain","BuildingMesh-00079001_37": "terrain","BuildingMesh-00044001_16": "terrain",
          "BuildingMesh-00035001_11": "terrain","BuildingMesh-00032001_10": "reservoir","BuildingMesh-00010001_0": "terrain","BuildingMesh-00028001_8": "terrain",
          "BuildingMesh-00040001_14": "terrain","BuildingMesh-00026001_6": "terrain","BuildingMesh-00161001_68": "terrain","BuildingMesh-00162001_69": "terrain",
          "BuildingMesh-00024001_4": "terrain","BuildingMesh-00029001_9": "terrain","BuildingMesh-00018001_2": "terrain","BuildingMesh-00025001_5": "terrain",
          "BuildingMesh-00050001_20": "terrain","BuildingMesh-00059001_24": "terrain","BuildingMesh-00060001_25": "terrain","BuildingMesh-00076001_35": "terrain",
          "BuildingMesh-00090001_42": "terrain","BuildingMesh-00119001_55": "terrain","BuildingMesh-00149001_63": "terrain","BuildingMesh-00156001_66": "terrain",
          "BuildingMesh-00157001_67": "terrain","BuildingMesh-00134001_59": "terrain","BuildingMesh-00109001_51": "intake","BuildingMesh-00091001_43": "terrain",
          "BuildingMesh-00180001_82": "terrain","BuildingMesh-00168001_73": "terrain","BuildingMesh-00047001_18": "terrain","BuildingMesh-00051001_21": "terrain",
          "BuildingMesh-00049001_19": "terrain","BuildingMesh-00069001_31": "terrain","BuildingMesh-00098001_46": "terrain","BuildingMesh-00198001_98": "terrain",
          "BuildingMesh-00186001_87": "terrain","BuildingMesh-00061001_26": "terrain","BuildingMesh-00036001_12": "terrain","BuildingMesh-00056001_23": "terrain",
          "BuildingMesh-00046001_17": "reservoir","BuildingMesh-00148001_62": "reservoir","BuildingMesh-00120001_56": "reservoir","BuildingMesh-00083001_38": "dam_wall",
          "BuildingMesh-00084001_39": "reservoir","BuildingMesh-00072001_32": "gates","BuildingMesh-00074001_34": "powerhouse","BuildingMesh-00073001_33": "foundation",
          "BuildingMesh-00187001_88": "outlet","BuildingMesh-00188001_89": "outlet","BuildingMesh-00196001_96": "dam_wall","BuildingMesh-00055001_22": "terrain",
          "BuildingMesh-00169001_74": "terrain","BuildingMesh-00170001_75": "foundation","BuildingMesh-00195001_95": "foundation"
        }
      },
      "models/dam2.glb": { name: "Earthfill Dam", partMap: {} },
      "models/dam3.glb": { name: "Arch Dam", partMap: {} }
    };

    let objectPartMap = modelConfigs["models/dam.glb"].partMap;

    // UPDATED ENGINEERING INFO: more coherent, readable but in-depth content
    const damInfo = {
      dam_wall: `<h3>⬟ Dam Wall (Monolith)</h3><b>Primary structural barrier — hydrostatic force resistance</b><br><br>
      <b>🔧 Engineering fundamentals:</b> The dam wall withstands horizontal water pressure, uplift, sediment loads, and seismic forces. For concrete gravity dams, stability relies on self-weight (mass concrete) creating a sufficient factor of safety (>1.5 against sliding, >1.0 against overturning).<br><br>
      <b>📊 Stress analysis:</b> Compressive stresses at heel/toe are maintained within 7–25 MPa for conventional concrete; RCC permits faster construction. Thermal contraction joints prevent cracking; drainage galleries reduce uplift pressure via relief wells.<br><br>
      <b>⚙️ Construction methods:</b> Roller-compacted concrete (RCC) or conventional mass placement with cooling pipes. For earthfill, core zones use impervious clay with granular filters and rockfill shoulders. Recent advances include self-compacting concrete and fiber reinforcement.<br><br>
      <b>🛡️ Safety monitoring:</b> Piezometers, inclinometers, and joint meters track internal strains; visual inspections focus on leakage, spalling, or displacement patterns.`,
      
      reservoir: `<h3>💧 Reservoir & Watershed Management</h3><b>Strategic water storage — multi‑objective regulation</b><br><br>
      <b>📐 Storage zones classification:</b><ul><li><b>Dead storage:</b> Below lowest outlet, traps sediment and maintains minimum ecological pool.</li><li><b>Active/conservation storage:</b> Usable volume for irrigation, municipal supply, hydropower generation.</li><li><b>Flood control storage:</b> Temporary surcharge above normal pool for attenuating flood peaks.</li><li><b>Buffer pool:</b> Emergency drought reserve.</li></ul>
      <b>📈 Operational rule curves:</b> Based on historical inflows, demand forecasts, and environmental flow requirements. Advanced models incorporate machine learning (LSTM networks) for inflow prediction and real-time gate control.<br><br>
      <b>🌱 Environmental considerations:</b> Reservoir stratification affects water quality; multi-level intakes minimize thermal pollution. Sedimentation reduces capacity over time — sustainable strategies include sluicing, dredging, and watershed management.<br><br>
      <b>🧪 Key metrics:</b> Residence time, trap efficiency, evaporation losses, and trophic state index (TSI) for limnological monitoring.`,
      
      powerhouse: `<h3>⚡ Hydroelectric Powerhouse</h3><b>Energy conversion — hydraulic to electrical grid</b><br><br>
      <b>🏭 Turbine selection matrix:</b><ul><li><b>Francis turbine:</b> Medium head (20–700 m), high efficiency (88–95%), most common.</li><li><b>Kaplan propeller turbine:</b> Low head (2–40 m), adjustable blades for variable flow.</li><li><b>Pelton wheel:</b> Very high head (>300 m), impulse design for mountainous sites.</li></ul>
      <b>🔌 Electrical & mechanical auxiliaries:</b> Generators (synchronous), excitation systems, governors (digital PID), cooling circuits, and step-up transformers. Digital twins enable predictive maintenance and vibration analysis.<br><br>
      <b>📐 Hydraulic design:</b> Penstock diameter, surge tank (to prevent water hammer), and draft tube recovery (kinetic energy regain). Efficiency improvements via computational fluid dynamics (CFD).<br><br>
      <b>📊 Power equation:</b> P = η × ρ × g × Q × H (kW). Modern plants achieve 90%+ overall efficiency. Pumped storage plants offer grid stability and energy arbitrage.`,
      
      terrain: `<h3>⛰️ Abutments & Foundation Geology</h3><b>Geotechnical interface — load transfer & stability</b><br><br>
      <b>🧭 Rock mechanics essentials:</b> Abutments must resist thrust forces (especially arch dams) with unconfined compressive strength >25 MPa. Discontinuities (joints, faults, bedding planes) are treated via consolidation grouting, dental concrete, or rock bolts.<br><br>
      <b>🪨 Site investigation methods:</b> Seismic refraction, borehole logging (rock quality designation - RQD), in‑situ shear tests, and Lugeon tests for permeability assessment.<br><br>
      <b>🔨 Remedial measures:</b> Curtain grouting creates low-permeability barrier, drainage blankets reduce uplift, and shear keys improve sliding resistance. Slope stability analyses (limit equilibrium & FEM) evaluate potential failure surfaces.<br><br>
      <b>📈 Instrumentation:</b> Extensometers, inclinometers, and load cells monitoring rock deformation under reservoir impoundment.`,
      
      spillway: `<h3>🌊 Spillway & Flood Routing</h3><b>Emergency discharge — overtopping prevention & flood mitigation</b><br><br>
      <b>🧮 Hydraulic design:</b> Ogee-crested spillways follow nappe profile for maximum discharge coefficient (typically 2.0–2.2). Chute spillways convey water downstream with stilling basins (hydraulic jump) for energy dissipation.<br><br>
      <b>📊 Design flood criteria:</b> Probable Maximum Flood (PMF) or 0.01% annual exceedance probability (AEP). Spillway capacity must pass routed outflow without exceeding maximum reservoir level.<br><br>
      <b>⚙️ Gate configurations:</b> Radial (Tainter) gates, vertical lift gates, fuse plugs, or labyrinth weirs to increase discharge capacity. Automation with real-time inflow forecasting and remote operation.<br><br>
      <b>💥 Energy dissipators:</b> Flip buckets, plunge pools, baffle blocks, or stilling basins to prevent scour downstream. Physical modeling (Froude similarity) verifies performance.`,
      
      gates: `<h3>⚙️ Control Gates & Hydraulic Steel Structures</h3><b>Flow regulation — precision release mechanisms</b><br><br>
      <b>🔄 Gate types & applications:</b><ul><li><b>Radial (Tainter) gates:</b> Efficient for spillway crests; trunnion design reduces hoist force.</li><li><b>Vertical lift gates (sluice gates):</b> High head outlets, often used for bottom outlets.</li><li><b>Emergency & maintenance gates:</b> Stoplogs, bulkheads for dewatering works.</li></ul>
      <b>🔧 Hydraulic forces:</b> Hydrostatic + hydrodynamic loads, vibration risk (gate flutter) mitigated by venting and stiffener design. Hoist systems include hydraulic cylinders or wire rope hoists.<br><br>
      <b>📏 Design standards:</b> USACE, USBR, or Eurocode guidelines for steel structures, corrosion protection (epoxy coating, cathodic protection), and leakage control (rubber seals).<br><br>
      <b>⚠️ Operational safety:</b> Gate position sensors, emergency backup power, and periodic non-destructive testing (ultrasonic, magnetic particle inspection).`,
      
      intake: `<h3>🚰 Intake Structure & Trashrack Systems</h3><b>Water conveyance — quality control & sediment management</b><br><br>
      <b>🏞️ Hydraulic design:</b> Intakes are placed at optimal elevation to avoid drawing warm surface water (if ecologically sensitive) or sediment-laden bottom layers. Multi-level intakes provide selective withdrawal capability.<br><br>
      <b>🪣 Trashracks & debris control:</b> Bar spacing based on turbine runner dimensions (typically 50–150 mm). Raked designs and automated cleaning rakes prevent clogging. Velocity through trashrack kept below 0.5–1 m/s to reduce head loss.<br><br>
      <b>🔐 Emergency closure:</b> Emergency gates (stoplogs or high-pressure gates) allow penstock isolation for maintenance. Intake towers include trashrack structures, gate slots, and ventilation shafts.<br><br>
      <b>📉 Sediment routing:</b> Vortex tubes or flushing channels divert bedload. Low-level outlets release density currents.`,
      
      outlet: `<h3>💦 Outlet Works & River Release</h3><b>Controlled release — environmental flows & drawdown</b><br><br>
      <b>💧 Functions:</b> Provide minimum ecological flow downstream, manage reservoir levels during droughts or maintenance, and allow reservoir drawdown for inspection. Outlet capacity typically ranges 5–20% of spillway design flood.<br><br>
      <b>📐 Configurations:</b> Bottom outlets (low-level) through the dam or diversion tunnel, often protected by multiple gates for redundancy. Conduit hydraulics require air vents to prevent sub-atmospheric pressures and cavitation.<br><br>
      <b>🌿 Environmental flows:</b> Regulated releases mimic natural hydrograph patterns (freshets, baseflows) for aquatic habitat protection. Fish passage facilities may be integrated where outlets serve as downstream migration routes.<br><br>
      <b>🔧 Valves & dissipators:</b> Hollow-jet valves, sleeve valves, or fixed-cone valves for high-head dissipation. Plunge pools dissipate energy and prevent erosion.`,
      
      foundation: `<h3>⛏️ Foundation & Grouting Curtain</h3><b>Load-bearing interface — seepage control & consolidation</b><br><br>
      <b>🛠️ Site preparation:</b> Overburden removal, dental concrete for surface irregularities, and shotcrete for temporary stabilization. Consolidation grouting fills near-surface fractures (depth 5–15 m) to increase rock stiffness.<br><br>
      <b>💧 Curtain grouting:</b> Deep grout curtain (often 0.5–1.0 times the hydraulic head) creates low-permeability barrier along the dam axis. Grout takes (water/cement ratio) are monitored via Lugeon tests. Post-grouting verification by water pressure tests and borehole imaging.<br><br>
      <b>📉 Uplift control:</b> Drainage galleries equipped with weepholes intercept seepage; relief wells reduce uplift pressures. Uplift pressure monitoring via piezometers ensures safety.<br><br>
      <b>📊 Finite element modeling:</b> Seepage analysis (SEEP/W, PLAXIS) simulates phreatic surfaces; stress-deformation models (FLAC3D) ensure settlement tolerance under full reservoir loads.`,
      
      general: `<h3>🏛️ Dam Engineering Core Principles</h3><b>Interactive hydraulic & geotechnical exploration</b><br><br>
      Modern dam engineering integrates hydrology, structural mechanics, geotechnics, and environmental science. Key threats include overtopping, internal erosion (piping), slope instability, and foundation settlement.<br><br>
      <b>📐 Design criteria:</b><ul><li>Structural stability: sliding FOS ≥ 1.5, overturning FOS ≥ 1.4</li><li>Permissible stresses: concrete compression ≤ 0.25 f'c, no tension under normal loads</li><li>Seismic performance: MDE (Maximum Design Earthquake) acceleration</li><li>Hydrologic safety: PMF routed with freeboard ≥ 1–3 m</li></ul>
      <b>🛰️ Instrumentation & monitoring:</b> Pendulums, piezometers, weirs, thermistors, automated data acquisition systems, and satellite InSAR for displacement tracking.<br><br>
      <b>🌍 Sustainability:</b> Run-of-river designs reduce flooding impact, fish ladders restore connectivity, sediment bypass tunnels minimize downstream erosion, and re-operation for environmental flows.<br><br>
      <b>🔍 Click any colored element (Dam Wall, Reservoir, Gates, etc.) for detailed technical breakdowns.</b>`
    };
    
    const tooltipNames = { foundation: "Foundation", dam_wall: "Dam Wall", reservoir: "Reservoir", spillway: "Spillway", gates: "Gates", powerhouse: "Power House", intake: "Intake", outlet: "Outlet Works", terrain: "Abutments" };

    // ========= THREE.JS SCENE =========
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xF5F0EA);
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 500);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.06;
    controls.rotateSpeed = 1.2;
    controls.zoomSpeed = 1.2;
    controls.panSpeed = 0.9;
    controls.screenSpacePanning = true;
    controls.maxPolarAngle = Math.PI / 1.9;
    controls.minDistance = 3.5;
    controls.maxDistance = 200;

    // Enhanced lighting: vibrant
    const ambient = new THREE.AmbientLight(0xffffff, 0.98);
    scene.add(ambient);
    const sunLight = new THREE.DirectionalLight(0xfff5e6, 1.9);
    sunLight.position.set(10, 22, 8);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 100;
    sunLight.shadow.camera.left = -15;
    sunLight.shadow.camera.right = 15;
    sunLight.shadow.camera.top = 15;
    sunLight.shadow.camera.bottom = -15;
    scene.add(sunLight);
    
    const fillLightWarm = new THREE.PointLight(0xd4b88a, 0.95);
    fillLightWarm.position.set(5, 6, 8);
    scene.add(fillLightWarm);
    const fillLightCool = new THREE.PointLight(0xa8c4d4, 0.75);
    fillLightCool.position.set(-4, 5, -6);
    scene.add(fillLightCool);
    const rimLight = new THREE.DirectionalLight(0xffe6c4, 0.9);
    rimLight.position.set(-5, 8, -6);
    scene.add(rimLight);
    const backRim = new THREE.PointLight(0xffcc88, 0.8);
    backRim.position.set(0, 5, -10);
    scene.add(backRim);
    const hemiLight = new THREE.HemisphereLight(0xf0e6d8, 0xc4d0dc, 0.75);
    scene.add(hemiLight);
    const fillBottom = new THREE.PointLight(0xccaa88, 0.5);
    fillBottom.position.set(0, -3, 0);
    scene.add(fillBottom);

    let damModel = null;
    let selectedObject = null;
    let modelCenter = new THREE.Vector3(0,0,0);
    let currentModelPath = "models/dam.glb";
    let isLoading = false;

    const tooltipDiv = document.getElementById("tooltip");
    const infoContentDiv = document.getElementById("infoContent");
    const resetBtn = document.getElementById("resetViewBtn");
    const loadingEl = document.getElementById("loadingIndicator");
    const raycaster = new THREE.Raycaster();
    const mouseVec = new THREE.Vector2();
    let mouseX = 0, mouseY = 0;
    let isDragging = false;

    function clearHighlight(obj) {
      if (!obj) return;
      const resetMat = (mat) => { if (mat && mat.emissive) { mat.emissive.setHex(0x000000); mat.emissiveIntensity = 0; } };
      if (Array.isArray(obj.material)) obj.material.forEach(resetMat);
      else resetMat(obj.material);
    }

    function highlight(obj) {
      if (selectedObject && selectedObject !== obj) clearHighlight(selectedObject);
      selectedObject = obj;
      const applyEmissive = (mat) => { if (mat && mat.emissive) { mat.emissive.setHex(0xAA8C64); mat.emissiveIntensity = 0.55; } };
      if (Array.isArray(obj.material)) obj.material.forEach(applyEmissive);
      else applyEmissive(obj.material);
    }

    function pickObject(hit) {
      let obj = hit.object;
      for (let i = 0; i < 3 && obj.parent && obj.parent !== damModel; i++) {
        if (obj.parent.name && !obj.parent.name.startsWith("Object_") && obj.parent.name !== "") return obj.parent;
        obj = obj.parent;
      }
      return obj;
    }

    function showInfo(key) {
      const displayKey = key.toLowerCase();
      const headerName = tooltipNames[displayKey] || displayKey.replace(/_/g,' ');
      infoContentDiv.innerHTML = `<div style="background:rgba(230, 215, 190, 0.3);padding:8px 14px;border-radius:48px;margin-bottom:18px;font-size:0.7rem;font-weight:700;color:#846B4E;text-align:center;letter-spacing:0.8px;">🔍 ${headerName.toUpperCase()}</div>${damInfo[displayKey] || damInfo.general}`;
    }

    function setOptimalCameraForModel() {
      if (!damModel) return;
      const box = new THREE.Box3().setFromObject(damModel);
      modelCenter = box.getCenter(new THREE.Vector3());
      const sizeVec = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(sizeVec.x, sizeVec.y, sizeVec.z);
      let distanceFactor = 2.2;
      if (currentModelPath === "models/dam.glb") distanceFactor = 6.0;
      else if (currentModelPath === "models/dam2.glb") distanceFactor = 2.8;
      else if (currentModelPath === "models/dam3.glb") distanceFactor = 3.2;
      const distance = Math.max(maxDim * distanceFactor, 25);
      const yOffset = modelCenter.y + maxDim * 0.12;
      controls.target.copy(modelCenter);
      camera.position.set(modelCenter.x, yOffset, modelCenter.z + distance);
      controls.update();
    }

    function loadModel(modelPath) {
      if (isLoading) return;
      isLoading = true;
      loadingEl.classList.add("active");
      if (damModel) scene.remove(damModel);
      if (selectedObject) clearHighlight(selectedObject);
      selectedObject = null;
      objectPartMap = modelConfigs[modelPath]?.partMap || {};
      const loader = new GLTFLoader();
      loader.load(modelPath, (gltf) => {
        damModel = gltf.scene;
        scene.add(damModel);
        damModel.traverse(child => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            if (child.material) {
              if (Array.isArray(child.material)) {
                child.material.forEach(m => { if(m) { m.roughness = Math.max(0.3, m.roughness || 0.4); m.metalness = Math.min(0.4, m.metalness || 0.1); } });
              } else { 
                child.material.roughness = Math.max(0.3, child.material.roughness || 0.4);
                child.material.metalness = Math.min(0.4, child.material.metalness || 0.1);
              }
            }
          }
        });
        setOptimalCameraForModel();
        isLoading = false;
        loadingEl.classList.remove("active");
        const modelName = modelConfigs[modelPath]?.name || "Dam Model";
        infoContentDiv.innerHTML = `<div style="background:rgba(230, 215, 190, 0.3);padding:6px 12px;border-radius:44px;margin-bottom:16px;font-size:0.7rem;color:#7A5E40;text-align:center;">✓ ${modelName} LOADED</div>${damInfo.general}`;
      }, undefined, (err) => {
        console.error(err);
        isLoading = false;
        loadingEl.classList.remove("active");
        infoContentDiv.innerHTML = `<h3>⚠️ Load error</h3><p>Could not load ${modelPath}. Ensure files exist.</p>`;
      });
    }

    window.addEventListener("mousedown", () => { isDragging = false; });
    window.addEventListener("mousemove", (e) => { 
      isDragging = true; 
      mouseX = e.clientX; 
      mouseY = e.clientY; 
      mouseVec.x = (e.clientX / renderer.domElement.clientWidth) * 2 - 1; 
      mouseVec.y = -(e.clientY / renderer.domElement.clientHeight) * 2 + 1; 
    });
    window.addEventListener("click", (e) => {
      if (isDragging || !damModel || isLoading) return;
      const m = new THREE.Vector2((e.clientX / renderer.domElement.clientWidth) * 2 - 1, -(e.clientY / renderer.domElement.clientHeight) * 2 + 1);
      const rc = new THREE.Raycaster(); rc.setFromCamera(m, camera);
      const hits = rc.intersectObjects(damModel.children, true);
      if (!hits.length) return;
      const obj = pickObject(hits[0]);
      highlight(obj);
      const engineeringKey = objectPartMap[obj.name];
      if (engineeringKey) showInfo(engineeringKey);
      else infoContentDiv.innerHTML = `<div style="text-align:center;opacity:0.8;">📌 Component: <b>${obj.name || "Structural element"}</b><br>Engineering details pending.</div>`;
    });

    const chipButtons = document.querySelectorAll(".model-chip");
    function setActiveChip(modelPath) {
      chipButtons.forEach(btn => {
        if (btn.getAttribute("data-model") === modelPath) btn.classList.add("active");
        else btn.classList.remove("active");
      });
    }
    chipButtons.forEach(btn => {
      btn.addEventListener("click", () => {
        const path = btn.getAttribute("data-model");
        if (path !== currentModelPath && !isLoading) {
          currentModelPath = path;
          setActiveChip(currentModelPath);
          loadModel(currentModelPath);
        }
      });
    });
    setActiveChip("models/dam.glb");

    resetBtn.addEventListener("click", () => {
      if (damModel) {
        setOptimalCameraForModel();
        if (selectedObject) clearHighlight(selectedObject);
        selectedObject = null;
        controls.update();
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animateTooltip() {
      if (!damModel || isLoading) return;
      raycaster.setFromCamera(mouseVec, camera);
      const intersects = raycaster.intersectObjects(damModel.children, true);
      if (intersects.length) {
        const obj = pickObject(intersects[0]);
        const keyName = objectPartMap[obj.name];
        if (keyName && tooltipNames[keyName]) {
          tooltipDiv.style.display = "block";
          tooltipDiv.style.left = mouseX + 16 + "px";
          tooltipDiv.style.top = mouseY + 16 + "px";
          tooltipDiv.innerHTML = tooltipNames[keyName];
        } else tooltipDiv.style.display = "none";
      } else tooltipDiv.style.display = "none";
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      animateTooltip();
      renderer.render(scene, camera);
    }

    showInfo("general");
    loadModel("models/dam.glb");
    animate();
  </script>
</body>
</html>
